<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | TechHub</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header>
    <a class="logo" href="/">TECH<span>HUB</span></a>
    <nav>
        <a href="/">Home</a>
        <a href="/products">Products</a>
        <a href="/about">About</a>
        <a href="/contact">Contact</a>
    </nav>
</header>
    <section class="page-hero"><div class="eyebrow">Get in touch</div><h1>Contact TechHub</h1><p class="muted">Have a question about the showcase? Send a sample message.</p></section>
    <main class="section">
        <div class="content-panel">
            <h2>Send us a message</h2>
            <p>This is a front-end demonstration form. It does not send or store messages.</p>
            <form class="contact-form" id="contact-form">
                <input type="text" placeholder="Your name" required>
                <input type="email" placeholder="Your email" required>
                <textarea placeholder="Write your message" required></textarea>
                <button class="button" type="submit">Submit message</button>
                <p id="form-message" aria-live="polite"></p>
            </form>
        </div>
    </main>
    <script src="/js/main.js"></script>
<footer>© 2026 TechHub Showcase · Built with Node.js and the HTTP module</footer>
</body>
</html>
